"></textarea>
            <div class="controls">
                <button onclick="downloadMarkdown()">📥 마크다운 다운로드</button>
                <button class="secondary" onclick="clearEditor()">🗑️ 초기화</button>
            </div>
        </div>

        <div class="preview-section">
            <div class="section-header">👁️ 미리보기</div>
            <div class="preview-content" id="preview"></div>
        </div>
    </div>

    <script>
        const textarea = document.getElementById('markdown-input');
        const preview = document.getElementById('preview');

        // 마크다운 렌더링
        function updatePreview() {
            const markdown = textarea.value;
            const html = marked.parse(markdown);
            preview.innerHTML = html;
        }

        // 입력할 때마다 미리보기 업데이트
        textarea.addEventListener('input', updatePreview);

        // 초기 렌더링
        updatePreview();

        // 마크다운 다운로드
        function downloadMarkdown() {
            const content = textarea.value;
            const filename = `post-${new Date().toISOString().split('T')[0]}.md`;
            
            const element = document.createElement('a');
            element.setAttribute('href', 'data:text/markdown;charset=utf-8,' + encodeURIComponent(content));
            element.setAttribute('download', filename);
            element.style.display = 'none';
            document.body.appendChild(element);
            element.click();
            document.body.removeChild(element);
        }

        // 에디터 초기화
        function clearEditor() {
            if (confirm('정말 삭제하시겠습니까?')) {
                textarea.value = '';
                updatePreview();
            }
        }

        // 단축키: Ctrl+S (또는 Cmd+S)로 다운로드
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                e.preventDefault();
                downloadMarkdown();
            }
        });
    </script>
