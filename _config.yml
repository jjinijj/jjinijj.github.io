title: jjinijj.log
Author: sis-jin
email: jjinstalk@gmail.com
header_pages:
  - categories.md
  - tistory.md
  - tags.md
  - about.markdown
  
description: >- # this means to ignore newlines until "baseurl:"
  AI 서비스를 만들며 쓰는 sis-jin의 개발 일지
lang: ko
# 홈 블루잉크 띠의 큰 문장 (_layouts/home.html)
home_headline: "무엇을 왜 정했는지 적는 기록"
# 홈 사이드바 프로필 카드 (_layouts/home.html)
avatar: /assets/img/avatar.webp
author_bio: "게임·앱·VR 개발을 거쳐 지금은 AI 에이전트 서비스를 만들고 있어요."
include: ["_pages"]
#baseurl: "https://something-is-strange.tistory.com/" # the subpath of your site, e.g. /blog
url: "https://jjinijj.github.io/" # the base hostname & protocol for your site, e.g. http://example.com
github_username:  jjinijj
# GitHub 계정 목록 (푸터 _includes/footer.html, 홈 프로필 카드 _layouts/home.html 에서 사용)
github_usernames:
  - jjinijj
  - jjinsword

# 프로젝트별 한 줄 설명. 홈 프로젝트 칩·막대·잔디 필터와 Categories 페이지에 쓴다.
# 키는 글 front matter 의 categories 값과 대소문자까지 같아야 한다.
# color 는 지금 디자인(블루잉크 × 코랄)에서는 쓰지 않는다.
projects:
  TripBranch:
    color: "#0072B2"
    description: "취향을 말하면 혼잡도까지 고려해 장소를 추천하는 여행 서비스"
  NineOuting:
    color: "#009E73"
    description: "회의 중 말을 실시간으로 받아 적고 안건을 정리하는 서비스"
  WhereWe:
    color: "#CC79A7"
    description: "NineOuting을 혼자 다시 만든 대면 회의 보드. 정한 것과 쟁점을 공용 화면에 띄운다"
  MoodReturn:
    color: "#D55E00"
    description: "기분을 한 줄 적으면 동물 직원이 엉뚱한 반품 영수증을 발급하는 서비스"
  Ovendo:
    color: "#E69F00"
    description: "베이킹이 잘못됐을 때 원인을 짚어 주는 Rule 기반 베이킹 어시스턴트"

# Build settings
theme: minima
plugins:
  - jekyll-feed

